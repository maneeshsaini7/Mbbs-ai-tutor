name: mbbs_ai_tutor
description: "MBBS AI Tutor — an original AI-assisted study app for MBBS students."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management / DI
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # UI / typography / assets
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0

  # Formatting
  intl: ^0.19.0

  # Config / secrets (loaded from --dart-define or a local, gitignored .env)
  flutter_dotenv: ^5.1.0

  # Backend (wired in Phase 3+; included now so DI seams are ready)
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3

  # PDF upload (Phase 7)
  file_picker: ^8.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
